<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>0+0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.textyle.net/f/galmuri11.css">
<style>
  :root{
    --bg:#f6f4ee;
    --ink:#2a2924;
    --sub:#8a8578;
    --console-1:#4a4a52;
    --console-2:#2c2c33;
    --console-3:#1c1c22;
    --console-line:#141419;
    --screen-bg:#0c1a12;
    --screen-glow:#8fe0a0;
    --screen-dim:#3f6b4a;
    --paper:#f2e8d5;
    --gold:#d9a441;
    --star-empty:#c9c5b8;
    --accent-red:#c94f3f;
    --accent-red-dark:#9c3a2e;
    --slot:#0b0b0d;
    --font-pixel:'Press Start 2P', monospace;
    --font-crt:'VT323', 'Courier New', monospace;
    --font-ui:'IBM Plex Mono', ui-monospace, monospace;
    --font-hand:'Galmuri11', monospace;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px);}
  *{box-sizing:border-box;}
  body{
    min-height:100vh;
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-ui);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:28px 24px 40px;
  }

  .page{
    width:100%;
    max-width:1100px;
  }

  header{
    max-width:420px;
    margin-bottom:8px;
  }
  header .kicker{
    font-size:13px;
    font-weight:500;
    color:var(--ink);
    margin-bottom:6px;
  }
  header p{
    font-size:13px;
    line-height:1.6;
    color:var(--sub);
    margin:0;
  }

  /* ================= composition ================= */
  .composition{
    position:relative;
    width:100%;
    height:min(760px, calc(100vh - 68px));
    min-height:760px;
    margin-top:0;
  }

  .console-col{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    z-index:2;
  }

  /* ---------- console ---------- */
  .console{
    position:relative;
    width:272px;
    padding:22px 20px 24px;
    background:linear-gradient(160deg, var(--console-1), var(--console-2) 55%, var(--console-3));
    border-radius:26px;
    box-shadow:
      0 1px 0 rgba(255,255,255,.06) inset,
      0 30px 60px -20px rgba(20,20,25,.35),
      0 10px 20px -8px rgba(20,20,25,.25);
  }
  .console::before{
    content:"";
    position:absolute; top:-14px; left:50%; transform:translateX(-50%);
    width:34px; height:18px;
    background:var(--console-3);
    border-radius:4px 4px 0 0;
  }

  .power-btn{
    width:36px; height:27px;
    background:#232227;
    border:1px solid #050505;
    border-radius:7px;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    color:#6b6970;
    transition:color .2s ease, background .2s ease;
    flex:0 0 auto;
  }
  .power-btn svg{ width:16px; height:16px; display:block; }
  .power-btn.on{ color:var(--accent-red); background:#2b2a2f; }
  .power-btn:active{ transform:translateY(1px); }

  .console.powered-off .screen-frame,
  .console.powered-off .plate,
  .console.powered-off .slot,
  .console.powered-off .controls-row{
    filter:grayscale(1) brightness(.7);
  }
  .console.powered-off .controls-row,
  .console.powered-off .screen{
    pointer-events:none;
  }
  .chips-row.powered-off .chip,
  .extra-row.powered-off .chip{
    filter:grayscale(.7) brightness(.65);
    pointer-events:none;
  }

  #view-off{ background:#000; }
  #view-off .off-line{
    width:100%; height:2px;
    background:var(--screen-glow);
    box-shadow:0 0 8px rgba(143,224,160,.8);
    animation:powerDown .5s ease forwards;
  }
  @keyframes powerDown{
    0%{ height:100%; opacity:1; }
    60%{ height:2px; opacity:1; }
    100%{ height:2px; opacity:0; width:0; }
  }

  .screen-frame{
    background:#050403;
    border-radius:8px;
    padding:9px;
  }
  .screen{
    position:relative;
    background:var(--screen-bg);
    height:188px;
    border-radius:3px;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    cursor:pointer;
    transition:height .25s ease;
  }

  .screen::after{
    content:"";
    position:absolute; inset:0;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,.22) 0px, rgba(0,0,0,.22) 1px, transparent 2px, transparent 3px);
    pointer-events:none;
    mix-blend-mode:multiply;
  }
  .screen-view{ width:100%; height:100%; display:none; flex-direction:column; align-items:center; justify-content:center; padding:12px; }
  .screen-view.active{ display:flex; animation:crtSceneIn .18s steps(2) both; }
  @keyframes crtSceneIn{
    0%{ opacity:0; transform:translateY(2px); filter:brightness(1.6); }
    55%{ opacity:.75; transform:translateY(0); filter:brightness(1.25); }
    100%{ opacity:1; transform:none; filter:none; }
  }

  #view-idle .idle-msg{ font-family:var(--font-pixel); font-size:12px; line-height:1.9; color:var(--screen-glow); text-shadow:0 0 6px rgba(143,224,160,.6); }
  #view-idle .cursor{ display:inline-block; width:7px; height:11px; background:var(--screen-glow); margin-left:4px; animation:blink 1s steps(1) infinite; vertical-align:middle; }
  @keyframes blink{ 50%{opacity:0;} }

  #view-boot{ position:relative; width:100%; height:100%; background:#000; }
  #view-boot .boot-noise{
    position:absolute; inset:0;
    background:repeating-linear-gradient(0deg, rgba(143,224,160,.18) 0 1px, transparent 1px 3px);
    animation:bootFlicker 1.15s steps(3) forwards;
  }
  #view-boot .boot-text{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-pixel); font-size:14px; letter-spacing:1px;
    color:var(--screen-glow);
    opacity:0;
    text-shadow:0 0 8px rgba(143,224,160,.7);
    animation:bootTextIn .25s ease .55s forwards, bootTextOut .2s ease 1s forwards;
  }
  @keyframes bootFlicker{
    0%{ opacity:0; }
    8%{ opacity:1; }
    16%{ opacity:.15; }
    28%{ opacity:.9; }
    40%{ opacity:.1; }
    55%{ opacity:.75; }
    75%{ opacity:.3; }
    100%{ opacity:0; }
  }
  @keyframes bootTextIn{ to{ opacity:1; } }
  @keyframes bootTextOut{ to{ opacity:0; } }

  #view-loading .dots{ font-family:var(--font-pixel); font-size:9px; color:var(--screen-glow); }
  #view-loading .bar{ width:130px; height:9px; border:2px solid var(--screen-glow); margin-top:13px; position:relative; overflow:hidden; }
  #view-loading .bar i{ position:absolute; left:0; top:0; bottom:0; width:0%; background:var(--screen-glow); animation:load .9s steps(12) forwards; }
  @keyframes load{ to{ width:100%; } }

  /* Memory screen: keep the vertical rhythm consistent across 3–4 line memories. */
  #view-memory{ padding:8px 9px; justify-content:flex-start; gap:0; }
  .memory-meta{ font-family:var(--font-pixel); font-size:6.5px; color:var(--gold); letter-spacing:1px; margin-bottom:7px; line-height:1.15; flex:0 0 auto; }
  .memory-photo{ width:116px; height:64px; object-fit:cover; image-rendering:pixelated; border:2px solid var(--screen-dim); margin-bottom:7px; opacity:0; transition:opacity .5s ease; flex:0 0 auto; }
  .memory-photo.show{ opacity:1; }
  .memory-letter{ font-family:var(--font-crt); font-size:14px; line-height:1.2; color:var(--screen-glow); max-width:198px; width:100%; height:67px; margin:0 0 6px; flex:0 0 67px; display:flex; align-items:center; justify-content:center; text-align:center; overflow:hidden; }
    .memory-footer{ display:flex; align-items:center; justify-content:center; gap:7px; min-height:10px; margin-top:1px; flex:0 0 auto; }
  .memory-stars,
  .memory-footer-dot,
  .memory-author{ display:inline-flex; align-items:center; justify-content:center; height:10px; line-height:10px; vertical-align:middle; }
  .memory-stars{ font-family:var(--font-pixel); font-size:9px; color:var(--gold); letter-spacing:.45px; transform:translateY(-2px); }
  .memory-footer-dot{ font-family:var(--font-pixel); font-size:5.5px; color:var(--screen-dim); }
  .memory-author{ font-family:var(--font-pixel); font-size:7.5px; color:var(--screen-glow); letter-spacing:.7px; }
  .memory-letter .typing-text{ display:inline; max-width:100%; }
  .memory-letter .cursor2{ display:inline-block; width:7px; height:12px; background:var(--screen-glow); margin-left:2px; vertical-align:middle; animation:blink 1s steps(1) infinite; }
  .next-hint{ font-family:var(--font-pixel); font-size:5.5px; color:var(--screen-dim); margin-top:0; min-height:8px; }
  #view-delete-confirm{ position:relative; gap:12px; padding:12px; }
  .delete-confirm-title{ font-family:var(--font-pixel); font-size:15px; line-height:1.5; letter-spacing:.5px; color:var(--screen-glow); text-shadow:0 0 10px rgba(143,224,160,.7); max-width:180px; }
  .delete-confirm-sub{ font-family:var(--font-pixel); font-size:5px; line-height:1.6; color:var(--gold); letter-spacing:.5px; }
  #view-complete{ position:relative; gap:8px; }
  .complete-title{ font-family:var(--font-pixel); font-size:12px; line-height:1.9; letter-spacing:.7px; color:var(--screen-glow); text-shadow:0 0 9px rgba(143,224,160,.75); animation:completePulse .8s steps(2) infinite; }
  .complete-sub{ font-family:var(--font-pixel); font-size:5px; color:var(--gold); letter-spacing:.5px; }
  @keyframes completePulse{ 50%{ opacity:.72; transform:scale(1.03); } }

  #view-rating{ padding:7px; }
  .rating-close{
    position:absolute; top:6px; right:6px;
    width:18px; height:18px;
    border-radius:50%;
    background:rgba(255,255,255,.08);
    border:none; color:var(--screen-dim);
    font-family:var(--font-crt); font-size:16px; line-height:1;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .rating-close:hover{ color:var(--screen-glow); background:rgba(255,255,255,.14); }
  #view-rating .rate-title{ font-family:var(--font-pixel); font-size:6.5px; color:var(--gold); margin-bottom:6px; line-height:1.4; text-align:center; }
  .stars{ display:flex; gap:4px; margin-bottom:6px; }
  .stars button{ background:none; border:none; cursor:pointer; font-size:15px; line-height:1; padding:1px; color:var(--star-empty); font-family:var(--font-crt); }
  .stars button.filled{ color:var(--gold); }
  #comment-box{ width:100%; max-width:210px; height:60px; background:#04120a; border:2px solid var(--screen-dim); color:var(--paper); font-family:var(--font-hand); font-size:12px; line-height:1.35; padding:6px; resize:none; }
  #comment-box:focus{ outline:2px solid var(--screen-glow); }
  #comment-box::placeholder{ color:#5c7a63; font-family:var(--font-hand); }
  .char-count{ font-family:var(--font-pixel); font-size:5px; color:var(--screen-dim); margin-top:3px; min-height:7px; text-align:right; width:100%; max-width:210px; letter-spacing:.3px; transition:color .12s ease, text-shadow .12s ease; }
  .char-count.warn, .modal-char-count.warn{ color:#d9a441; text-shadow:0 0 5px rgba(217,164,65,.35); }
  .char-count.critical, .modal-char-count.critical{ color:#d95b4f; text-shadow:0 0 6px rgba(217,91,79,.45); }
  .save-btn{ margin-top:14px; font-family:var(--font-pixel); font-size:6px; color:var(--screen-bg); background:var(--screen-glow); border:none; padding:6px 11px; cursor:pointer; letter-spacing:1px; }
  .save-btn:active{ transform:translateY(1px); }
  .saved-msg{ font-family:var(--font-pixel); font-size:5px; color:var(--gold); margin-top:4px; min-height:7px; }

  /* ---------- memory album ---------- */
  #view-gallery{
    position:relative;
    padding:8px 8px 7px;
    justify-content:flex-start;
    overflow:hidden;
  }
  .gallery-head{
    width:100%;
    display:flex; align-items:center; justify-content:space-between;
    padding:0 1px 6px;
    color:var(--gold);
    font-family:var(--font-pixel);
    font-size:6px;
    letter-spacing:.5px;
    flex:0 0 auto;
  }
  .gallery-close{
    position:static; z-index:4;
    width:12px; height:12px; border-radius:2px;
    border:0;
    background:transparent; color:var(--screen-dim);
    font-family:var(--font-crt); font-size:10px; line-height:1;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    padding:0;
    opacity:.8;
    flex:0 0 auto;
  }
  .gallery-close:hover{ color:var(--screen-glow); opacity:1; }
  .gallery-grid{
    width:100%; flex:1 1 auto; min-height:0;
    overflow-y:auto; overflow-x:hidden;
    display:grid; grid-template-columns:repeat(3,1fr);
    gap:6px; align-content:start;
    padding:1px 1px 8px;
    scrollbar-width:none;
  }
  .gallery-grid::-webkit-scrollbar{ display:none; }
  .gallery-item{
    position:relative; border:1px solid #31583c; background:#07150d;
    padding:3px; cursor:pointer; min-width:0;
    transition:transform .15s ease, border-color .15s ease, box-shadow .15s ease;
  }
  .gallery-item:hover, .gallery-item.selected{
    transform:translateY(-2px); border-color:var(--screen-glow);
    box-shadow:0 0 8px rgba(143,224,160,.22);
  }
  .gallery-item img{
    display:block; width:100%; aspect-ratio:1/0.78; object-fit:cover;
    image-rendering:pixelated;
  }
  .gallery-item .gallery-order{
    position:absolute; left:5px; top:5px;
    background:rgba(4,18,10,.82); color:var(--gold);
    font-family:var(--font-pixel); font-size:5px; padding:2px 3px;
  }
  .gallery-meta{ position:absolute; left:4px; right:4px; bottom:4px; display:flex; align-items:center; justify-content:space-between; gap:4px; pointer-events:none; }
  .gallery-author{ background:rgba(4,18,10,.84); color:#d9d5c8; font-family:var(--font-pixel); font-size:4.5px; line-height:1; padding:2px 3px; white-space:nowrap; }
  .gallery-item .gallery-stars{ position:static;
    position:absolute; right:4px; bottom:4px;
    background:rgba(4,18,10,.84); color:var(--gold);
    font-family:var(--font-crt); font-size:11px; line-height:1; padding:1px 3px;
  }
  .gallery-empty{
    width:100%; height:100%; display:flex; align-items:center; justify-content:center;
    color:var(--screen-dim); font-family:var(--font-pixel); font-size:5px; line-height:2;
    text-align:center;
  }
  .gallery-hint{
    width:100%; flex:0 0 auto; padding-top:3px; text-align:center;
    color:var(--screen-dim); font-family:var(--font-pixel); font-size:4.5px;
  }

  .album-btn{
    width:36px; height:27px;
    background:#232227; border:1px solid #050505; border-radius:7px;
    cursor:pointer; display:flex; align-items:center; justify-content:center;
    color:#6b6970; transition:color .2s ease, background .2s ease; flex:0 0 auto;
  }
  .album-btn svg{ width:16px; height:16px; display:block; }
  .album-btn:hover, .album-btn.active{ color:#d6d2c6; background:#2b2a2f; }
  .album-btn:active{ transform:translateY(1px); }

  .plate{
    display:flex; justify-content:space-between; align-items:center;
    padding:10px 4px 0;
    font-family:var(--font-ui);
    font-size:13px; font-weight:500;
    color:#cfcdc4;
    letter-spacing:.5px;
  }
  .sound-toggle{
    background:none; border:none; cursor:pointer;
    font-size:12px; line-height:1; padding:2px;
    opacity:.7; filter:grayscale(1);
  }
  .sound-toggle:hover{ opacity:1; }
  .sound-toggle.muted{ opacity:.35; }

  .slot-row{ display:flex; align-items:center; justify-content:center; gap:10px; margin-top:12px; }
  .slot{ width:112px; height:13px; background:var(--slot); border-radius:3px; margin:0; position:relative; }
  .slot-tab{
    position:absolute; left:50%; top:-13px;
    width:36px; height:15px;
    border-radius:5px 5px 2px 2px;
    box-shadow:0 -1px 0 rgba(255,255,255,.15) inset;
    opacity:0;
    transform:translateX(-50%) translateY(10px) scaleY(.25);
    transform-origin:bottom center;
    pointer-events:none;
  }
  .slot-tab.pop-in{ animation:slotPopIn .38s cubic-bezier(.34,1.56,.64,1) forwards; }
  .slot-tab.pop-out{ animation:slotPopOut .22s ease-in forwards; }
  @keyframes slotPopIn{
    0%{ opacity:0; transform:translateX(-50%) translateY(10px) scaleY(.25); }
    60%{ opacity:1; transform:translateX(-50%) translateY(-5px) scaleY(1.15); }
    100%{ opacity:1; transform:translateX(-50%) translateY(0) scaleY(1); }
  }
  @keyframes slotPopOut{
    0%{ opacity:1; transform:translateX(-50%) translateY(0) scaleY(1); }
    100%{ opacity:0; transform:translateX(-50%) translateY(10px) scaleY(.25); }
  }
  .slot::after{ content:""; position:absolute; left:8px; right:8px; top:4px; height:4px; background:#000; opacity:.5; }

  .controls-row{
    display:flex; justify-content:space-between; align-items:center;
    margin-top:20px;
    padding:0 2px;
  }
  .dpad{
    display:grid;
    grid-template-columns:26px 26px 26px;
    grid-template-rows:26px 26px 26px;
    gap:2px;
  }
  .dpad button{
    background:var(--console-3);
    border:none;
    color:#9a988f;
    font-family:var(--font-ui);
    font-size:10px;
    cursor:pointer;
    border-radius:3px;
  }
  .dpad button:active{ background:#000; }
  .dpad .up{ grid-column:2; grid-row:1; border-radius:4px 4px 2px 2px; }
  .dpad .left{ grid-column:1; grid-row:2; border-radius:4px 2px 2px 4px; }
  .dpad .mid{ grid-column:2; grid-row:2; background:transparent; }
  .dpad .right{ grid-column:3; grid-row:2; border-radius:2px 4px 4px 2px; }
  .dpad .down{ grid-column:2; grid-row:3; border-radius:2px 2px 4px 4px; }

  .action-btn{
    width:62px; height:62px;
    border-radius:16px;
    background:linear-gradient(160deg, var(--accent-red), var(--accent-red-dark));
    border:none;
    color:#fff2ee;
    font-family:var(--font-pixel);
    font-size:7px;
    cursor:pointer;
    box-shadow:0 4px 0 #7a2c22, 0 8px 14px rgba(0,0,0,.25);
  }
  .action-btn:active{ transform:translateY(3px); box-shadow:0 1px 0 #7a2c22; }
  .action-btn:disabled{ opacity:.4; cursor:not-allowed; box-shadow:none; }

  .random-btn{
    width:27px; height:27px;
    background:#232227; border:1px solid #050505; border-radius:7px;
    color:#6b6970; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    flex:0 0 auto;
  }
  .random-btn svg{ width:15px; height:15px; }
  .random-btn:hover{ color:#c7c4ba; }
  .random-btn:active{ transform:translateY(1px); }

  .console.shake{ animation:consoleShake .28s ease; }
  @keyframes consoleShake{
    0%,100%{ transform:translateX(0); }
    25%{ transform:translateX(-2px) rotate(-.3deg); }
    50%{ transform:translateX(2px) rotate(.3deg); }
    75%{ transform:translateX(-1px); }
  }
  .console.reacting{ animation:consoleReact .34s cubic-bezier(.22,.8,.3,1); }
  .screen.reacting::before{ content:""; position:absolute; inset:0; z-index:3; background:rgba(143,224,160,.18); pointer-events:none; animation:screenFlash .22s steps(2) forwards; }
  @keyframes consoleReact{
    0%{ transform:translateY(0) rotate(0); }
    30%{ transform:translateY(-1px) rotate(-.35deg); }
    60%{ transform:translateY(1px) rotate(.35deg); }
    100%{ transform:translateY(0) rotate(0); }
  }
  @keyframes screenFlash{ 0%{opacity:.9} 100%{opacity:0} }


  .chip[draggable="true"]{ cursor:grab; }
  .chip.dragging{ opacity:.35; }
  .slot.drag-over{ box-shadow:0 0 0 2px var(--screen-glow); }


  /* ---------- gallery -> cartridge flight ---------- */
  .gallery-flight{
    position:fixed;
    z-index:9999;
    pointer-events:none;
    object-fit:cover;
    image-rendering:pixelated;
    border:2px solid var(--screen-glow);
    box-shadow:0 0 18px rgba(143,224,160,.38);
    border-radius:3px;
    will-change:transform, opacity;
  }
  .gallery-flight.snap{
    animation:gallerySnap .18s cubic-bezier(.2,.8,.3,1) forwards;
  }
  @keyframes gallerySnap{
    0%{ opacity:1; filter:brightness(1.4); }
    55%{ opacity:1; filter:brightness(2); }
    100%{ opacity:0; transform:var(--flight-transform) scale(.18) !important; }
  }
  .chip.receiving{
    animation:chipReceive .34s cubic-bezier(.34,1.56,.64,1);
    z-index:8;
  }
  @keyframes chipReceive{
    0%{ transform:var(--chip-rot) scale(1); }
    45%{ transform:var(--chip-rot) scale(1.08) translateY(-4px); }
    100%{ transform:var(--chip-rot) scale(1); }
  }

  /* ---------- cartridges ---------- */
  .chip{
    position:absolute;
    width:88px;
    background:linear-gradient(165deg, #2d2c31, #17161a 65%);
    border-radius:9px;
    padding:7px 7px 9px;
    cursor:pointer;

  .chip-state{ color:#9fd8aa; }

  .chip-edit{

  @media (max-width:760px){

  @media (max-width:760px){

<script>
(async function(){

  // ---- Supabase shared memory database ----
  // This is a publishable browser key. RLS policies on the table are the security boundary.
  const SUPABASE_URL = "https://emzdxboyouxphjqrgmsb.supabase.co";
  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_UESDd6vpOamDBwDE8b_mlw_sQ0gqj3n";
  const SUPABASE_TABLE = encodeURIComponent("0+0");
  const SUPABASE_ENDPOINT = SUPABASE_URL + "/rest/v1/" + SUPABASE_TABLE;
  const SUPABASE_HEADERS = {
    "apikey": SUPABASE_PUBLISHABLE_KEY,
    "Content-Type": "application/json"
  };

  let cloudReady = false;
  let cloudRows = [];
  let cloudError = null;

  async function cloudRequest(url, options={}){
    const res = await fetch(url, {
      ...options,
      headers: Object.assign({}, SUPABASE_HEADERS, options.headers || {})
    });
    const text = await res.text();
    let data = null;
    try{ data = text ? JSON.parse(text) : null; }catch(e){ data = text; }
    if(!res.ok){
      const message = data && (data.message || data.error_description || data.hint) ? JSON.stringify(data) : String(data || res.statusText);
      throw new Error("Supabase " + res.status + ": " + message);
    }
    return data;
  }

  async function cloudFetchRows(){
    return await cloudRequest(SUPABASE_ENDPOINT + "?select=*");
  }

  function cloudMemoryFromRow(row){
    if(!row || !row.memory_id) return null;
    const preset = pickPreset(row.memory_id);
    return {
      id: row.memory_id,
      title: row.title || "이름 없는 추억",
      author: row.author || "H",
      date: formatMemoryDate(row.date || ""),
      letter: row.letter || "아직 적지 않은 이야기.",
      photo: labelArt(preset.bg1, preset.bg2, preset.accent, preset.icon),
      shot: row.photo || null
    };
  }

  function cloudRatingFromRow(row){
    if(!row || row.rating === null || row.rating === undefined) return null;
    const stars = Number(row.rating) || 0;
    const savedAt = row.created_at ? Date.parse(row.created_at) : 0;
    return {
      stars,
      comment: row.comment || "",
      savedAt: Number.isFinite(savedAt) ? savedAt : 0
    };
  }

  function cloudRow(id){
    return cloudRows.find(r=>r.memory_id===id) || null;
  }

  async function cloudUpsertMemory(memory, shotOverride){
    const row = {
      memory_id: memory.id,
      title: memory.title || "이름 없는 추억",
      date: formatMemoryDate(memory.date || ""),
      author: memory.author || "H",
      letter: memory.letter || "아직 적지 않은 이야기.",
      photo: shotOverride !== undefined ? (shotOverride || null) : (memory.shot || null),
      created_at: new Date().toISOString()
    };
    const data = await cloudRequest(SUPABASE_ENDPOINT + "?on_conflict=memory_id", {
      method:"POST",
      headers:{ "Prefer":"resolution=merge-duplicates,return=representation" },
      body:JSON.stringify(row)
    });
    const saved = Array.isArray(data) ? data[0] : data;
    if(saved){
      const i = cloudRows.findIndex(r=>r.memory_id===saved.memory_id);
      if(i>-1) cloudRows[i] = saved;
      else cloudRows.push(saved);
    }
    return saved || row;
  }

  async function cloudSaveRating(id, rating){
    const now = rating && rating.savedAt ? new Date(rating.savedAt).toISOString() : new Date().toISOString();
    const data = await cloudRequest(SUPABASE_ENDPOINT + "?memory_id=eq." + encodeURIComponent(id), {
      method:"PATCH",
      headers:{ "Prefer":"return=representation" },
      body:JSON.stringify({
        rating: Number(rating.stars) || 0,
        comment: rating.comment || "",
        created_at: now
      })
    });
    const saved = Array.isArray(data) ? data[0] : data;
    if(saved){
      const i = cloudRows.findIndex(r=>r.memory_id===saved.memory_id);
      if(i>-1) cloudRows[i] = saved;
    }
  }

  async function cloudDeleteMemory(id){
    await cloudRequest(SUPABASE_ENDPOINT + "?memory_id=eq." + encodeURIComponent(id), {
      method:"DELETE",
      headers:{ "Prefer":"return=minimal" }
    });
    cloudRows = cloudRows.filter(r=>r.memory_id!==id);
  }

  function localMemoryList(){
    return BASE
      .filter(base=>!deleted.includes(base.id))
      .map(applyOverride)
      .concat(custom.filter(m=>!deleted.includes(m.id)));

  async function initializeCloud(){
    try{
      cloudRows = await cloudFetchRows();
      if(!Array.isArray(cloudRows)) cloudRows = [];

      // Seed the four built-in memories once, using stable memory_id values.
      for(const base of BASE){
        if(!cloudRow(base.id)){
          await cloudUpsertMemory(base, null);
        }
      }

      // Migrate this browser's existing custom memories and edits into the shared database.
      for(const m of custom){
        if(!deleted.includes(m.id)){
          await cloudUpsertMemory(m, m.shot || null);
        }
      }
      for(const base of BASE){
        if(deleted.includes(base.id)){
          await cloudDeleteMemory(base.id);
        } else if(overrides[base.id]){
          const merged = Object.assign({}, base, overrides[base.id]);
          await cloudUpsertMemory(merged, merged.shot || null);
        }
      }

      // Migrate existing local ratings/comments so the current project state is not lost.
      const localIds = new Set([...BASE.map(x=>x.id), ...custom.map(x=>x.id)]);
      for(const id of localIds){
        const localRating = loadJSON("console:rating:"+id, null);
        if(localRating && !cloudRatingFromRow(cloudRow(id))){
          await cloudSaveRating(id, localRating);
        }
      }

      cloudReady = true;
      cloudRows = await cloudFetchRows();
    }catch(e){
      cloudError = e;
      cloudReady = false;
      console.warn("Supabase connection is not ready yet:", e);
    }
  }

  let actx = null;

  function tone(freq, dur, delay, type, vol){
    if(muted) return;
    try{
      if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
      if(actx.state === "suspended") actx.resume();
      const t0 = actx.currentTime + (delay||0);
      const o = actx.createOscillator();
      const g = actx.createGain();
      o.type = type || "square";
      o.frequency.setValueAtTime(freq, t0);
      g.gain.setValueAtTime(vol||0.05, t0);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g); g.connect(actx.destination);
      o.start(t0);
      o.stop(t0 + dur + 0.02);
    }catch(e){ /* audio unavailable, ignore */ }
  }

    const w = 180, h = 180;
    let svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}">`;
    svg += `<defs><radialGradient id="g${bg1.slice(1)}" cx="50%" cy="38%" r="80%">
      <stop offset="0%" stop-color="${bg2}"/><stop offset="100%" stop-color="${bg1}"/>
    </radialGradient></defs>`;
    svg += `<rect width="${w}" height="${h}" fill="url(#g${bg1.slice(1)})"/>`;
    let dots = "";
    for(let i=0;i<26;i++){
      const dx = (i*37)%w, dy=(i*53+10)%h, r = (i%3===0)?1.6:1;
      dots += `<circle cx="${dx}" cy="${dy}" r="${r}" fill="${accent}" opacity="0.16"/>`;
    }
    svg += dots;
    if(iconSvg) svg += `<g transform="translate(90,96) scale(1.7) translate(-90,-90)">${iconSvg}</g>`;
    svg += `</svg>`;
    return "data:image/svg+xml;utf8," + encodeURIComponent(svg);
  }

  function flyGalleryPhotoToChip(item, idx){
    const source = item.querySelector("img");
    const target = chipEls[idx];

    sfx.select();
    const from = source.getBoundingClientRect();
    const to = target.getBoundingClientRect();
    const flight = document.createElement("img");
    flight.className = "gallery-flight";
    flight.src = source.currentSrc || source.src;
    const w = Math.max(36, from.width);
    const h = Math.max(28, from.height);
    flight.style.width = w + "px";
    flight.style.height = h + "px";
    flight.style.left = from.left + "px";
    flight.style.top = from.top + "px";
    document.body.appendChild(flight);

    // Keep the gallery visible for the first part of the flight, then let the image
    // cross the page as the gallery closes underneath it.
    const dx = (to.left + to.width/2) - (from.left + from.width/2);
    const dy = (to.top + to.height/2) - (from.top + from.height/2);
    const sx = to.width / from.width;
    const sy = to.height / from.height;
    const rot = (idx % 2 ? -4 : 4);
    const transform = `translate(${dx}px, ${dy}px) rotate(${rot}deg) scale(${Math.max(.22, sx)}, ${Math.max(.22, sy)})`;

      closeGallery(false);

        flight.style.transition = "transform .62s cubic-bezier(.18,.82,.28,1), opacity .62s ease";

      target.classList.remove("receiving");
      void target.offsetWidth;
      target.classList.add("receiving");
      sfx.insert();
      flight.classList.add("snap");
    }, 620);

      target.classList.remove("receiving");
      selectChip(idx);
      insertChip(idx);
    }, 790);
  }

  btnNext.addEventListener("click", ()=>{ if(views.gallery.classList.contains("active")){ physicalReact("button"); moveGallerySelection(1); return; } if(current || inputLocked()) return; physicalReact("button"); sfx.nav(); selectChip((selected+1)%memories.length); });

  function insertChip(idx, loadingLabel){
    if(inputLocked()) return;
    sfx.insert();
    const m = memories[idx];
    saveJSON("console:viewed:"+m.id, true);
    chipEls[idx].classList.remove("state-unseen");
    chipEls[idx].classList.add("state-viewed");
    const stateEl = chipEls[idx].querySelector(".chip-state");
    if(stateEl && !loadRating(m.id)) stateEl.textContent = "VIEWED";
    current = m;
    chipEls[idx].classList.add("used");
    chipEls[idx].classList.remove("selected");
    btnEject.disabled = false;
    physicalReact("insert");
    consoleBody.classList.remove("shake");
    void consoleBody.offsetWidth;
    consoleBody.classList.add("shake");
    const preset = pickPreset(m.id);
    slotTab.style.background = `linear-gradient(160deg, ${preset.bg2}, ${preset.bg1})`;
    slotTab.classList.remove("pop-out");
    void slotTab.offsetWidth;
    slotTab.classList.add("pop-in");
    document.querySelector("#view-loading .dots").textContent = loadingLabel || "LOADING...";
    showView("loading");
    const bar = document.querySelector("#view-loading .bar i");
    bar.style.animation = "none"; void bar.offsetWidth; bar.style.animation = "";
    setTimeout(()=> playMemory(m), 950);
  }

  function playMemory(m){
    showView("memory");
    const rating = loadRating(m.id);
    document.getElementById("memory-date").textContent = formatMemoryDate(m.date) + " • " + (m.title||"");
    document.getElementById("memory-stars").textContent = rating ? "★".repeat(Math.max(0, Math.min(5, rating.stars || 0))) : "";
    document.getElementById("memory-footer").style.visibility = (rating || m.author) ? "visible" : "hidden";
    document.getElementById("memory-author").textContent = "From. " + (m.author || "H");
    const photo = document.getElementById("memory-photo");
    photo.src = m.shot || m.photo;
    photo.classList.remove("show");
    requestAnimationFrame(()=> photo.classList.add("show"));

    const letterEl = document.getElementById("memory-letter");
    letterEl.innerHTML = "";
    const hintEl = document.getElementById("memory-hint");
    hintEl.textContent = "눌러서 계속";
    hintEl.style.visibility = "hidden";
    letterDone = false;
    let i = 0;
    clearInterval(typing);
    typing = setInterval(()=>{
      i++;
      letterEl.innerHTML = '<span class="typing-text">' + m.letter.slice(0,i) + '<span class="cursor2"></span></span>';
      if(i % 2 === 0) sfx.tick();
      if(i >= m.letter.length){
        clearInterval(typing);
        letterDone = true;
        // Keep the memory screen free of a duplicate completion label.
        // GO! appears only after saving a note; pressing it opens the completion screen.
        hintEl.textContent = completionMode ? "GO!" : "";
        hintEl.style.visibility = completionMode ? "visible" : "hidden";
      }
    }, 45);
  }

  function advance(){
    if(inputLocked()) return;
    if(views.deleteConfirm.classList.contains("active")){
      confirmDelete();
      return;
    }
    if(views.gallery.classList.contains("active")){
      const items=[...galleryGrid.querySelectorAll(".gallery-item")];
      if(items[galleryIndex]) items[galleryIndex].click();
      return;
    }
    if(views.memory.classList.contains("active")){
      if(!letterDone){
        clearInterval(typing);
        document.getElementById("memory-letter").textContent = current.letter;
        letterDone = true;
        const hint = document.getElementById("memory-hint");
        hint.textContent = completionMode ? "GO!" : "";
        hint.style.visibility = completionMode ? "visible" : "hidden";
      } else {
        if(completionMode){
          showCompletion(completionMode);
        } else {
          openRating();
        }
      }
    } else if(views.idle.classList.contains("active") && !current){
      insertChip(selected);
    }
  }

  function showCompletion(mode){
    const title = document.querySelector("#view-complete .complete-title");
    const sub = document.querySelector("#view-complete .complete-sub");
    if(mode === "mission"){
      title.textContent = "MISSION COMPLETE!";
      sub.textContent = "MEMORY UPDATED";
    } else {
      title.textContent = "MEMORY COMPLETE!";
      sub.textContent = "MEMORY SAVED";
    }
    completionMode = null;
    sfx.save();
    showView("complete");
    setTimeout(()=>{
      if(views.complete.classList.contains("active")){
        showView("memory");
        document.getElementById("memory-hint").textContent = "눌러서 계속";
        document.getElementById("memory-hint").style.visibility = "visible";
      }
    }, 1250);
  }

  screenEl.addEventListener("click", ()=>{
    if(views.deleteConfirm.classList.contains("active")) return;
    sfx.tick();
    advance();
  });
  // Form controls inside the CRT must not bubble into the screen-level "advance" handler.
  [document.getElementById("comment-box"), document.getElementById("save-btn"), ratingClose, document.getElementById("stars")]
    .forEach(el=>el && el.addEventListener("click", e=>e.stopPropagation()));
  document.getElementById("comment-box").addEventListener("pointerdown", e=>e.stopPropagation());
  document.getElementById("comment-box").addEventListener("input", ()=>{
    updateCharCount(document.getElementById("comment-box"), document.getElementById("comment-count"), 100);
  });
  document.getElementById("field-letter").addEventListener("input", ()=>{
    updateCharCount(document.getElementById("field-letter"), document.getElementById("letter-count"), 100);
  });
  btnAction.addEventListener("click", (e)=>{ e.stopPropagation(); if(inputLocked()) return; physicalReact("go"); sfx.go(); advance(); });

  btnReplay.addEventListener("click", ()=>{
    if(views.deleteConfirm.classList.contains("active")){
      physicalReact("button");
      sfx.nav();
      cancelDelete();
      return;
    }
    if(current && views.memory.classList.contains("active")) playMemory(current);
  });

  function openRating(){
    showView("rating");
    document.getElementById("rating-title").innerHTML = current.title + " · 별점을 남겨 주세요.";
    const starsEl = document.getElementById("stars");
    starsEl.innerHTML = "";
    let stars = 0;
    const existing = loadRating(current.id);
    if(existing) stars = existing.stars;
    document.getElementById("comment-box").value = existing ? existing.comment : "";
    updateCharCount(document.getElementById("comment-box"), document.getElementById("comment-count"), 100);
    document.getElementById("saved-msg").textContent = existing ? "이전 기록을 불러왔어요." : "";

    for(let s=1;s<=5;s++){
      const b = document.createElement("button");
      b.textContent = "★"; b.type = "button";
      if(s<=stars) b.classList.add("filled");
      b.addEventListener("click", ()=>{
        sfx.select();
        stars = s;
        [...starsEl.children].forEach((c,i)=> c.classList.toggle("filled", i<stars));
      });
      starsEl.appendChild(b);
    }

    document.getElementById("save-btn").onclick = async ()=>{
      sfx.save();
      const comment = document.getElementById("comment-box").value.trim();
      const existingSaved = loadRating(current.id);
      const savedAt = existingSaved && existingSaved.savedAt ? existingSaved.savedAt : Date.now();
      const ratingData = { stars: stars, comment: comment, savedAt: savedAt };
      saveRating(current.id, ratingData);
      if(cloudReady){
        try{
          await cloudSaveRating(current.id, ratingData);
        }catch(e){
          console.error("Supabase rating save failed:", e);
          document.getElementById("saved-msg").textContent = "기록을 저장하지 못했어요.";
          return;
        }
      }
      document.getElementById("saved-msg").textContent = "메모리 슬롯에 기록했어요!";
      renderGallery();
      const idx = memories.indexOf(current);
      let badge = chipEls[idx].querySelector(".chip-badge");
      if(!badge){
        badge = document.createElement("div");
        badge.className = "chip-badge";
        chipEls[idx].appendChild(badge);
      }
      badge.textContent = "★" + stars;
      chipEls[idx].classList.remove("state-unseen","state-viewed");
      chipEls[idx].classList.add("state-commented");
      const stateEl = chipEls[idx].querySelector(".chip-state");
      if(stateEl) stateEl.textContent = "COMMENTED";
      // Saving a new/edited rating is the end of the recording step.
      // Return to the memory screen and let GO trigger MEMORY COMPLETE.
      completionMode = "memory";
      showView("memory");
      const hint = document.getElementById("memory-hint");
      hint.textContent = "GO!";
      hint.style.visibility = "visible";
    };
  }

  function ejectCurrent(){
    if(!current) return;
    sfx.eject();
    clearInterval(typing);
    const idx = memories.indexOf(current);
    chipEls[idx].classList.remove("used");
    current = null;
    btnEject.disabled = true;
    slotTab.classList.remove("pop-in");
    void slotTab.offsetWidth;
    slotTab.classList.add("pop-out");
    btnAlbum.classList.remove("active");
    showView("idle");
    selectChip(idx);
  }

  function backToMemory(){
    showView("memory");
    document.getElementById("memory-hint").style.visibility = "visible";
  }

  btnEject.addEventListener("click", ()=>{ if(!inputLocked()) physicalReact("button"); ejectCurrent(); });
  ratingClose.addEventListener("click", (e)=>{ e.stopPropagation(); sfx.close(); backToMemory(); });
  btnAlbum.addEventListener("click", (e)=>{ e.stopPropagation(); physicalReact("button"); openGallery(); });
  galleryClose.addEventListener("click", (e)=>{ e.stopPropagation(); closeGallery(); });

  function turnOff(){
    if(booting || !poweredOn) return;
    poweredOn = false;
    clearInterval(typing);
    if(current){
      const idx = memories.indexOf(current);
      if(idx > -1) chipEls[idx].classList.remove("used");
    }
    current = null;
    letterDone = false;
    btnEject.disabled = true;
    slotTab.classList.remove("pop-in");
    void slotTab.offsetWidth;
    slotTab.classList.add("pop-out");
    sfx.powerOff();
    btnPower.classList.remove("on");
    consoleBody.classList.add("powered-off");
    btnAlbum.classList.remove("active");
    chipsEl.classList.add("powered-off");
    extraRow.classList.add("powered-off");
    showView("off");
  }

  function turnOn(){
    if(booting || poweredOn) return;
    poweredOn = true;
    sfx.powerOn();
    btnPower.classList.add("on");
    consoleBody.classList.remove("powered-off");
    chipsEl.classList.remove("powered-off");
    extraRow.classList.remove("powered-off");
    booting = true;
    showView("boot");
    const noise = document.querySelector("#view-boot .boot-noise");
    const text = document.querySelector("#view-boot .boot-text");
    noise.style.animation = "none"; void noise.offsetWidth; noise.style.animation = "";
    text.style.animation = "none"; void text.offsetWidth; text.style.animation = "";
    setTimeout(()=>{
      booting = false;
      showView("idle");
      selectChip(Math.min(selected, memories.length-1));
    }, 1250);
  }

  btnPower.addEventListener("click", ()=>{
    if(poweredOn) { physicalReact("button"); turnOff(); } else turnOn();
  });

  btnEject.disabled = true;

  // ---------------- drag-and-drop insert ----------------
  const slotDrop = document.querySelector(".slot");
  const slotVisual = document.querySelector(".slot");
  slotDrop.addEventListener("dragover", (e)=>{
    if(current || inputLocked()) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = "move";
    slotVisual.classList.add("drag-over");
  });
  slotDrop.addEventListener("dragleave", ()=> slotVisual.classList.remove("drag-over"));
  slotDrop.addEventListener("drop", (e)=>{
    e.preventDefault();
    slotVisual.classList.remove("drag-over");
    if(current || inputLocked()) return;
    const idx = parseInt(e.dataTransfer.getData("text/plain"), 10);
    if(Number.isInteger(idx) && memories[idx]){
      physicalReact("insert");
      selectChip(idx);
      insertChip(idx);
    }
  });

  // ---------------- gallery keyboard / d-pad ----------------
  let galleryIndex = 0;
  function moveGallerySelection(delta){
    if(!views.gallery.classList.contains("active")) return;
    const items = [...galleryGrid.querySelectorAll(".gallery-item")];
    if(!items.length) return;
    galleryIndex = (galleryIndex + delta + items.length) % items.length;
    items.forEach((el,i)=>el.classList.toggle("selected", i===galleryIndex));
    items[galleryIndex].scrollIntoView({block:"nearest"});
    sfx.nav();
  }
  // ---------------- random play ----------------
  const btnRandom = document.getElementById("btn-random");
  btnRandom.addEventListener("click", ()=>{
    if(current || inputLocked()) return;
    physicalReact("button");
    sfx.nav();
    const idx = Math.floor(Math.random() * memories.length);
    selectChip(idx);
    insertChip(idx, "SEARCHING...");
  });

  // ---------------- sound mute toggle ----------------
  const soundToggle = document.getElementById("sound-toggle");
  soundToggle.addEventListener("click", ()=>{
    muted = !muted;
    soundToggle.textContent = muted ? "🔈" : "🔊";
    soundToggle.classList.toggle("muted", muted);
    if(!muted) sfx.nav();
  });

  // ---------------- editor modal (add / edit / delete) ----------------
  const modalBackdrop = document.getElementById("modal-backdrop");
  const modalTitle = document.getElementById("modal-title");
  const photoPreview = document.getElementById("photo-preview");
  const photoPlaceholder = document.getElementById("photo-placeholder");
  const photoInput = document.getElementById("photo-input");
  const fieldDate = document.getElementById("field-date");
  const fieldTitle = document.getElementById("field-title");
  const fieldLetter = document.getElementById("field-letter");
  const fieldAuthor = document.getElementById("field-author");
  const modalFrom = document.getElementById("modal-from");
  const modalDelete = document.getElementById("modal-delete");

  let editingId = null;
  let editingShot = null;

  function todayStr(){
    const d = new Date();
    return d.getFullYear()+". "+String(d.getMonth()+1).padStart(2,"0")+". "+String(d.getDate()).padStart(2,"0")+".";
  }

  function openEditor(id){
    const m = memories.find(x=>x.id===id);
    if(!m) return;
    editingId = id;
    editingShot = m.shot || null;
    modalTitle.textContent = "추억 수정";
    fieldAuthor.value = m.author || "H";
    modalFrom.textContent = "From. " + (m.author || "H");
    fieldDate.value = formatMemoryDate(m.date || "");
    fieldTitle.value = m.title || "";
    fieldLetter.value = m.letter || "";
    updateCharCount(fieldLetter, document.getElementById("letter-count"), 100);
    if(editingShot){ photoPreview.src = editingShot; photoPreview.style.display = "block"; photoPlaceholder.style.display = "none"; }
    else { photoPreview.style.display = "none"; photoPlaceholder.style.display = "block"; }
    modalDelete.style.display = "inline-block";
    document.getElementById("modal-save").textContent = "완료";
    modalBackdrop.classList.add("open");
  }

  function openAdder(){
    editingId = null;
    editingShot = null;
    modalTitle.textContent = "새 추억 만들기";
    fieldAuthor.value = "H";
    modalFrom.textContent = "From. H";
    fieldDate.value = todayStr();
    fieldTitle.value = "";
    fieldLetter.value = "";
    updateCharCount(fieldLetter, document.getElementById("letter-count"), 100);
    photoPreview.style.display = "none";
    photoPlaceholder.style.display = "block";
    modalDelete.style.display = "none";
    document.getElementById("modal-save").textContent = "저장";
    modalBackdrop.classList.add("open");
  }

  addBtn.addEventListener("click", ()=>{
    if(inputLocked()) return;
    physicalReact("button");
    const blank = document.createElement("div");
    blank.className = "chip chip-blank chip-drop";
    blank.innerHTML = `<div class="chip-face"></div><div class="chip-edge"></div>`;
    extraRow.insertBefore(blank, addBtn);
    sfx.drop();
    setTimeout(()=>{
      blank.remove();
      openAdder();
    }, 480);
  });
  document.getElementById("modal-cancel").addEventListener("click", ()=>{
    if(editingId){
      const m = memories.find(x=>x.id===editingId);
      if(m){
        fieldDate.value = formatMemoryDate(m.date || "");
        fieldAuthor.value = m.author || "H";
        modalFrom.textContent = "From. " + (m.author || "H");
        fieldTitle.value = m.title || "";
        fieldLetter.value = m.letter || "";
        updateCharCount(fieldLetter, document.getElementById("letter-count"), 100);
      }
    }
    modalBackdrop.classList.remove("open");
  });
  modalBackdrop.addEventListener("click", (e)=>{ if(e.target===modalBackdrop) modalBackdrop.classList.remove("open"); });
  document.getElementById("photo-picker").addEventListener("click", ()=> photoInput.click());

  photoInput.addEventListener("change", ()=>{
    const file = photoInput.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        const w = 20, h = 14;
        const c = document.createElement("canvas");
        c.width = w; c.height = h;
        const ctx = c.getContext("2d");
        const srcRatio = img.width/img.height, dstRatio = w/h;
        let sx=0, sy=0, sw=img.width, sh=img.height;
        if(srcRatio > dstRatio){ sw = img.height*dstRatio; sx = (img.width-sw)/2; }
        else{ sh = img.width/dstRatio; sy = (img.height-sh)/2; }
        ctx.drawImage(img, sx, sy, sw, sh, 0, 0, w, h);
        editingShot = c.toDataURL("image/png");
        photoPreview.src = editingShot;
        photoPreview.style.display = "block";
        photoPlaceholder.style.display = "none";
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });

  document.getElementById("modal-save").addEventListener("click", async ()=>{
    const id = editingId || ("u"+Date.now());
    const title = fieldTitle.value.trim() || "이름 없는 추억";
    const preset = pickPreset(id);
    const author = fieldAuthor.value.trim() || "H";
    const data = {
      id: id,
      title: title,
      author: author,
      date: formatMemoryDate(fieldDate.value.trim()),
      letter: fieldLetter.value.trim() || "아직 적지 않은 이야기.",
      photo: labelArt(preset.bg1, preset.bg2, preset.accent, preset.icon),
      shot: editingShot || null
    };
    const wasEditingCurrent = !!(editingId && current && editingId === current.id);

    try{
      if(cloudReady){
        await cloudUpsertMemory(data, data.shot || null);
      } else if(editingId){
        if(editingId.indexOf("u")===0){
          const i = custom.findIndex(x=>x.id===editingId);
          if(i>-1) custom[i] = Object.assign({}, data);
        } else {
          overrides[editingId] = Object.assign({}, data);
          saveJSON("console:overrides", overrides);
        }
        saveJSON("console:custom", custom);
      } else {
        custom.push(Object.assign({}, data));
        saveJSON("console:custom", custom);
      }

      modalBackdrop.classList.remove("open");
      renderAll();

      if(wasEditingCurrent){
        current = memories.find(x=>x.id===editingId) || current;
        completionMode = "mission";
        const idx = memories.findIndex(x=>x.id===current.id);
        if(idx>-1){
          chipEls[idx].classList.add("used");
          chipEls[idx].classList.remove("selected");
          selected = idx;
          btnEject.disabled = false;
        }
        playMemory(current);
      }
    }catch(e){
      console.error("Supabase memory save failed:", e);
      document.getElementById("modal-save").textContent = "다시 시도";
    }
  });

  function openDeleteConfirm(id){
    if(!id) return;
    pendingDeleteId = id;
    modalBackdrop.classList.remove("open");
    physicalReact("screen");
    showView("deleteConfirm");
  }

  function cancelDelete(){
    pendingDeleteId = null;
    showView(current ? "memory" : "idle");
  }

  async function confirmDelete(){
    if(!pendingDeleteId) return;
    const id = pendingDeleteId;

    try{
      if(cloudReady){
        await cloudDeleteMemory(id);
      } else {
        const i = custom.findIndex(x=>x.id===id);
        if(i>-1){
          custom.splice(i,1);
          saveJSON("console:custom", custom);
        } else if(BASE.some(x=>x.id===id) && !deleted.includes(id)){
          deleted.push(id);
          saveJSON("console:deleted", deleted);
        }
        try{ localStorage.removeItem("console:rating:"+id); }catch(e){}
        try{ localStorage.removeItem("console:viewed:"+id); }catch(e){}
      }

      pendingDeleteId = null;
      current = null;
      completionMode = null;
      renderAll();
      selected = Math.min(selected, Math.max(0, memories.length-1));
      selectChip(selected);
      btnEject.disabled = true;
      showView("idle");
      sfx.save();
    }catch(e){
      console.error("Supabase memory delete failed:", e);
    }
  }

  modalDelete.addEventListener("click", ()=>{
    if(!editingId) return;
    openDeleteConfirm(editingId);
  });

  await initializeCloud();

  renderAll();

  setTimeout(()=>{
    booting = false;
    showView("idle");
    if(cloudError) console.warn("0+0 is using local storage until Supabase schema/setup is complete.");
  }, 1250);

})();
</script>
</body>
</html>
